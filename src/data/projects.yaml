# Projects shown on the landing page, sorted by `order` (lower first).
# Fields: id, title, lang (of the title, if not English), summary, stack
# (optional), links.live and/or links.source (optional: leave links out when
# there is nothing public to visit), order. The build fails on unknown fields.

- id: cuanto-cuesta
  title: ¿Cuánto cuesta?
  lang: es
  summary: >-
    Compares the routes for turning US dollars in Payoneer into Argentine
    pesos, with the fees of every step, to show which one leaves you the most.
    Its Python API stores the day's prices and prefills them. In Spanish and
    English.
  # Backend first: what the project shows about backend work.
  stack: [Python, FastAPI, PostgreSQL, TypeScript, React, Vite]
  links:
    live: https://cuanto-cuesta.abrunacci.dev
    source: https://github.com/Abrunacci/cuanto-cuesta
  order: 10

- id: berry-med
  title: Berry Med
  summary: >-
    Software for health-check kiosks, built for a client. It connects the
    client's backend with the medical devices in each kiosk: it reads vital
    signs over USB or Bluetooth (blood oxygen, pulse, blood pressure,
    temperature and a 7-lead ECG), sends them during each check and reports
    each kiosk's status.
  stack: [Python, asyncio, pyserial, Bleak, Pusher, PyInstaller]
  # No live site: the software needs the kiosk's hardware to run.
  links:
    source: https://github.com/Abrunacci/berry_med
  order: 15

- id: epb-stock
  title: EPB Stock
  summary: >-
    Stock control for retail shops: a product with a FastAPI backend and
    PostgreSQL.
  stack: [Python, FastAPI, PostgreSQL]
  # No links: the repository is private and the site is only a login.
  order: 20

- id: data-pipeline
  title: data-pipeline
  summary: >-
    Collects market data on a schedule, checks each value and sends it to the
    app that uses it. Today it feeds ¿Cuánto cuesta? the exchange rates it
    needs.
  stack: [Python, Pydantic, httpx, Docker]
  links:
    source: https://github.com/Abrunacci/data-pipeline
  order: 30

- id: infra
  title: infra
  summary: >-
    Infrastructure as code for the server that hosts these projects: Terraform
    and Ansible on DigitalOcean and Cloudflare.
  stack: [Terraform, Ansible, Docker Compose, Caddy, PostgreSQL]
  links:
    source: https://github.com/Abrunacci/infra
  order: 40
