<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph image</title>
<style>
  @font-face {
    font-family: Inter;
    font-weight: 100 900;
    src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    position: relative;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 80px;
    background: #f8fafc;
    color: #0f172a;
    font-family: Inter, system-ui, Arial, sans-serif;
    font-feature-settings: "cv11", "ss01";
  }
  .halo {
    position: absolute;
    right: -20px;
    top: 50%;
    width: 440px;
    height: 440px;
    transform: translateY(-50%);
    border-radius: 50%;
    background: conic-gradient(from 200deg, #74acdf, #f6b40e, #a5d8ff, #74acdf);
    filter: blur(70px);
    opacity: 0.6;
  }
  .text { position: relative; flex: 1; display: grid; gap: 22px; }
  h1 { margin: 0; font-size: 78px; white-space: nowrap; font-weight: 800; line-height: 1; letter-spacing: -0.045em; }
  p { margin: 0; }
  .role { font-size: 32px; white-space: nowrap; font-weight: 600; letter-spacing: -0.01em; }
  .tagline { font-size: 32px; white-space: nowrap; color: #475569; }
  .mark {
    color: #0f172a;
    background: linear-gradient(90deg, rgb(116 172 223 / 0.45), rgb(246 180 14 / 0.4)) no-repeat 0 88% / 100% 0.42em;
  }
  .meta { margin-top: 14px; display: grid; gap: 6px; font-size: 26px; color: #475569; }
  .url { color: #4338ca; font-weight: 700; }
  .avatar {
    position: relative;
    flex: none;
    display: grid;
    place-items: center;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: #fff;
    border: 8px solid #fff;
    box-shadow: 0 0 0 2px #e2e8f0, 0 40px 80px -40px rgb(79 70 229 / 0.6);
  }
  .avatar span {
    font-size: 84px;
    font-weight: 700;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #2f6fa8, #4f46e5);
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>
  <div class="halo"></div>
  <div class="text">
    <h1>Alejandro Brunacci</h1>
    <p class="role">Senior Backend Engineer · Python &amp; FastAPI</p>
    <p class="tagline">Backends for <span class="mark">GenAI and data products</span></p>
    <p class="meta"><span>Argentina · Remote · US time zone overlap</span><span class="url">abrunacci.dev</span></p>
  </div>
  <div class="avatar"><span>AB</span></div>
</body>
</html>
