---
name: Deploy

# Builds the site with Astro and publishes dist/ to https://abrunacci.dev on
# every push to main, or by hand. Before the site, it publishes the contact
# form's image (backend/) and deploys it by digest. The server side (deploy
# user, one key per project, deploy.sh, deploy-backend) lives in the infra
# repository: see "Deploying a project" and "Deploying a backend" in its
# ansible/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# One deploy at a time. A newer run waits instead of cancelling one that is
# uploading.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Lowercase, as infra's projects.yml names it.
  IMAGE: ghcr.io/abrunacci/abrunacci-dev-backend

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Caches npm's download cache, keyed on package-lock.json.
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      # Same checks as ci.yml: nothing that fails there can be deployed.
      # Type-checks src/ (the build does not): content schema, component
      # props, frontmatter.
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Validate HTML
        run: npx --no html-validate dist tools
      - name: Test the site checker
        run: python -m unittest discover -s tools
      - name: Check internal links and publishable files
        run: python tools/check_site.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          # Hidden files are uploaded too, so the server's rules decide: it
          # accepts .well-known/ and rejects any other hidden file, loudly,
          # instead of the artifact dropping them silently.
          include-hidden-files: true
          # An approval that comes after 7 days finds no artifact: then use
          # "Re-run all jobs", which checks and uploads it again.
          retention-days: 7
          # A re-run (redeploying an earlier commit) replaces its own artifact.
          overwrite: true

  # Same checks as the backend job in ci.yml.
  backend:
    name: Check the backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run mypy
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  publish:
    name: Publish the backend image
    needs: backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      # What the deploy sends: the digest, not a tag (a tag moves).
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # provenance and sbom off: the digest names one manifest, linux/amd64,
      # not an index with attestations.
      #
      # No version is ever deleted from GHCR: the package is public, so storage
      # is free, and a rollback or a rebuilt server can always pull any release.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: [check, publish]
    # The production environment only accepts main; this makes the intent
    # explicit and skips the approval request for anything else.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewers approve each run before this job starts, and only
    # this job sees the environment's secrets.
    environment:
      name: production
      url: https://abrunacci.dev
    permissions: {}
    env:
      SITE_URL: https://abrunacci.dev/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Write the deploy key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "::error::DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS is missing in the production environment."
            exit 1
          fi
          case "$DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::The publish job gave no image digest ('$DIGEST')."; exit 1 ;;
          esac
          # Readable only by us; removed by the last step, whatever happens.
          umask 077
          mkdir "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"

      # First the backend, by digest: the server pulls that image, switches the
      # container and puts the previous one back if /api/health does not
      # answer. A failure stops the job before the site is touched. stdin
      # closed: deploy-backend reads nothing.
      - name: Deploy the backend
        shell: bash
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy-ssh/key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            deploy@server.abrunacci.dev deploy-backend "$GITHUB_SHA" "$DIGEST" "$GITHUB_RUN_ID" </dev/null

      # The server's identity is always checked against the pinned line.
      - name: Deploy the site
        shell: bash
        run: |
          set -euo pipefail
          tar -C site -cz . \
            | ssh -i "$RUNNER_TEMP/deploy-ssh/key" \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
                -o GlobalKnownHostsFile=/dev/null \
                -o BatchMode=yes \
                -o ConnectTimeout=15 \
                deploy@server.abrunacci.dev deploy "$GITHUB_SHA" "$GITHUB_RUN_ID"

      # Also when a step above failed or was cancelled.
      - name: Remove the SSH key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"

      # The site must serve exactly this commit's build: the root and every
      # file, byte for byte. A file missing on the server fails too: outside
      # /assets/ the server answers with index.html, which does not match,
      # and under /assets/ with a 404. current switches atomically, so the
      # retries (the whole check, up to 5 times) only cover the network.
      - name: Check the published site
        shell: bash
        run: |
          set -euo pipefail
          [[ -f site/index.html ]]
          # URL path of every file, percent-encoded from its bytes (names need
          # not be UTF-8), paired with the file itself.
          mapfile -d '' files < <(find site -type f -print0 | sort -z)
          mapfile -t urls < <(python3 -c '
          import os, sys, urllib.parse
          for f in sys.argv[1:]:
              print(urllib.parse.quote(os.fsencode(f)[len(b"site/"):]))
          ' "${files[@]}")
          problem=""
          for attempt in 1 2 3 4 5; do
            (( attempt == 1 )) || sleep 3
            rm -f served.html
            if ! curl -fsS --max-time 10 -o served.html "$SITE_URL"; then
              problem="$SITE_URL did not answer (see the curl errors above)."
              continue
            fi
            if ! cmp -s served.html site/index.html; then
              if grep -q 'en construcción' served.html; then
                problem="$SITE_URL still serves the placeholder."
              else
                problem="$SITE_URL serves something other than this commit's index.html."
              fi
              continue
            fi
            problem=""
            for i in "${!files[@]}"; do
              url="${SITE_URL}${urls[i]}"
              if ! curl -fsS --max-time 10 -o served.file "$url"; then
                problem="$url did not answer, or answered with an error."
                break
              elif ! cmp -s served.file "${files[i]}"; then
                problem="$url is not served as committed."
                break
              fi
            done
            if [[ -z "$problem" ]]; then
              echo "$SITE_URL serves this commit's build (${#files[@]} files)."
              exit 0
            fi
          done
          echo "::error::$problem"
          exit 1

      # The public side of the backend: Caddy reaches it and it serves the form.
      - name: Check the published backend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "${SITE_URL}api/health"
          echo
          curl -fsS --max-time 10 "${SITE_URL}contact" | grep -q 'action="/api/contact"'
          echo "${SITE_URL}contact serves the form."
