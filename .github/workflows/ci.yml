---
name: CI

# Pull requests cover every branch; push only re-checks what lands on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    # main's ruleset requires a check with this exact name: renaming the job
    # leaves every pull request waiting for a check that never comes.
    name: Validate HTML and internal links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails when a commit of the pull request is not mine or carries a
      # co-author or an attribution line. The policy lives in the infra repo;
      # it fetches the commits itself and passes on pushes to main.
      - name: Check commit metadata
        uses: Abrunacci/infra/.github/actions/check-commit-metadata@1306bea3c9d3c518394cc9ea249d7b3753a7a381 # main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # Caches npm's download cache, keyed on package-lock.json.
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      # Type-checks src/ (the build does not): content schema, component
      # props, frontmatter.
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Validate HTML
        run: npx --no html-validate dist tools
      - name: Test the site checker
        run: python -m unittest discover -s tools
      - name: Check internal links and publishable files
        run: python tools/check_site.py dist

  # The contact form's service (backend/). Not a required check: a pull request that only
  # touches the page does not need it, and it runs anyway.
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run mypy
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # The production image builds (deploy.yml publishes it from main). Nothing is pushed here.
  backend-image:
    name: Backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --tag abrunacci-dev-backend:ci backend
