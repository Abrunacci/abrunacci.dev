---
name: CI

# Pull requests cover every branch; push only re-checks what lands on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    # main's ruleset requires a check with this exact name: renaming the job
    # leaves every pull request waiting for a check that never comes.
    name: Validate HTML and internal links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # Caches npm's download cache, keyed on package-lock.json.
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate HTML
        run: npx --no html-validate dist tools
      - name: Test the site checker
        run: python -m unittest discover -s tools
      - name: Check internal links and publishable files
        run: python tools/check_site.py dist
