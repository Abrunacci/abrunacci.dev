{% extends "base.html" %}
{% block title %}{{ t.sent_title }}{% endblock %}
{% block meta %}
  <meta name="robots" content="noindex">
{% endblock %}
{% block style %}
    .actions { margin-top: 2rem; }
{% endblock %}
{% block main %}
      <p class="eyebrow">{{ t.eyebrow }}</p>
      <h1>{{ t.sent_heading }}</h1>
      <p class="lead">{{ t.sent_lead }}</p>
      <p class="actions"><a class="btn btn--secondary" href="{{ site_url }}{{ t.home }}">{{ t.back }}</a></p>
{% endblock %}
