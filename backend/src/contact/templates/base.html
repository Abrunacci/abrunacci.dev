<!DOCTYPE html>
<html lang="{{ t.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Alejandro Brunacci</title>
  {% block meta %}{% endblock %}
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/api/static/inter-latin-wght-normal-5.3.0.woff2" as="font" type="font/woff2" crossorigin>
  {# Colors, type and buttons follow the landing's src/styles/global.css. #}
  <style>
    @font-face {
      font-family: "Inter";
      src: url("/api/static/inter-latin-wght-normal-5.3.0.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --on-accent: #ffffff;
      --accent-text: #4338ca;
      --focus: #4f46e5;
      --shadow-accent: rgb(79 70 229 / 0.6);
      /* Form fields' borders: 3:1 against the surface, as controls need. */
      --field-border: #64748b;
      --error: #b91c1c;
      --error-soft: #fef2f2;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --surface: #111827;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #1f2937;
        --border-strong: #374151;
        --accent: #a5b4fc;
        --accent-hover: #c7d2fe;
        --on-accent: #0b1020;
        --accent-text: #a5b4fc;
        --focus: #a5b4fc;
        --shadow-accent: rgb(0 0 0 / 0.6);
        --field-border: #64748b;
        --error: #fca5a5;
        --error-soft: #2a1215;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      font-feature-settings: "cv11", "ss01";
      font-size: 1.0625rem;
      line-height: 1.6;
    }

    h1, p { margin: 0; }

    a { color: inherit; }

    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .page {
      max-width: 36rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      color: var(--muted);
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 0.25em;
    }

    .back:hover {
      color: var(--text);
      text-decoration-color: currentColor;
    }

    .eyebrow {
      margin-top: 2rem;
      color: var(--accent-text);
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 0.5rem;
      font-size: clamp(1.625rem, 5vw, 2rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .lead {
      margin-top: 0.75rem;
      color: var(--muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 3.25rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font: inherit;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .btn--primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--on-accent);
      box-shadow: 0 10px 30px -12px var(--shadow-accent);
    }

    .btn--primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn--secondary {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text);
    }

    .btn--secondary:hover { border-color: var(--text); }

    {% block style %}{% endblock %}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="page">
    <a class="back" href="{{ site_url }}{{ t.home }}">← abrunacci.dev</a>
    <main>
      {% block main %}{% endblock %}
    </main>
  </div>
</body>
</html>
